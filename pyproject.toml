[project]
name = "ah-bonus-recipe"
version = "0.1.0"
description = "Weekly Albert Heijn Bonus scraper and recipe recommender."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.136.1",
    "httpx>=0.27.0",
    "openai>=1.109.0",
    "pandas>=2.2.2",
    "pydantic>=2.8.2",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "uvicorn>=0.47.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "ruff>=0.6.2",
]

[project.scripts]
ah-bonus = "ah_bonus_recipe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
